spring.application.name=demo

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Environment Secret Configuration
jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# System Integration & Hardware Simulation Modes
smartfarming.sensor.mode=${SENSOR_MODE:SIMULATED}
smartfarming.drone.mode=${DRONE_MODE:SIMULATED}
smartfarming.weather.api-key=${WEATHER_API_KEY:}
smartfarming.weather.api-url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}
smartfarming.mandi.api-url=${MANDI_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}

# Jackson JSON Deserialization Configuration
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false